[package]
name = "lia"
version = "0.1.0"
edition = "2021"
authors = ["Lia Team"]
description = "Compiler and runtime for a language with finite routines and isolated actors"

[dependencies]
libc = "0.2"
tokio = { version = "1.35", features = ["full"] }
bumpalo = "3.14"
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
petgraph = "0.6"
core_affinity = "0.8"
crossbeam-deque = "0.8"
crossbeam-channel = "0.5"

[dev-dependencies]
